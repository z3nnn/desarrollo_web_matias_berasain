
<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estadísticas</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>

<body>

  <header>
    <h1>Estadísticas de Actividades</h1>
    <nav>
      <ul class="menu">
        <li><a href="{{ url_for('index') }}">Inicio</a></li>
        <li><a href="{{ url_for('agregar') }}">Agregar Actividad</a></li>
        <li><a href="{{ url_for('listado') }}">Listado</a></li>
        <li><a href="{{ url_for('estadisticas') }}" class="active">Estadísticas</a></li>
      </ul>
    </nav>
  </header>

  <main class="main-container">
    <section>
      <h2>1. Cantidad de actividades por día</h2>
      <div style="text-align: center;">
        <img src="{{ url_for('static', filename='img/estadisticas/lineas_dias.png') }}" alt="Gráfico de líneas que muestra la cantidad de actividades por día" width="600">
      </div>
    </section>

    <section>
      <h2>2. Total de actividades por tipo</h2>
      <div style="text-align: center;">
        <img src="{{ url_for('static', filename='img/estadisticas/torta_tipos.png') }}" alt="Gráfico de torta que muestra el total de actividades por tipo" width="600">
      </div>
    </section>

    <section>
      <h2>3. Actividades por mes y horario</h2>
      <div style="text-align: center;">
        <img src="{{ url_for('static', filename='img/estadisticas/barras_horarios.png') }}" alt="Gráfico de barras que muestra actividades por mes y horario" width="700">
      </div>
    </section>

    <br><br>
    <div style="text-align: center;">
      <a href="{{ url_for('index') }}" class="boton-volver">Volver a la portada</a>
    </div>
  </main>

</body>
</html>
