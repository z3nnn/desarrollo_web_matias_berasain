
<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estadísticas</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
  <script src="https://code.highcharts.com/highcharts.js"></script>
  <script src="{{ url_for('static', filename='js/estadisticas.js') }}"></script>
</head>

<body>

  <header>
    <h1>Estadísticas de Actividades</h1>
    <nav>
      <ul class="menu">
        <li><a href="{{ url_for('index') }}">Inicio</a></li>
        <li><a href="{{ url_for('agregar') }}">Agregar Actividad</a></li>
        <li><a href="{{ url_for('listado') }}">Listado</a></li>
        <li><a href="{{ url_for('estadisticas') }}" class="active">Estadísticas</a></li>
      </ul>
    </nav>
  </header>

  <main class="main-container">
    <section>
      <h2>1. Cantidad de actividades por día</h2>
      <div style="text-align: center;">
        <div id="grafico-lineas" style="width: 600px; height: 400px; margin: auto;"></div>
      </div>
    </section>

    <section>
      <h2>2. Total de actividades por tipo</h2>
      <div style="text-align: center;">
        <div id="grafico-torta" style="width: 600px; height: 400px; margin: auto;"></div>
      </div>
    </section>

    <section>
      <h2>3. Actividades por mes y horario</h2>
      <div style="text-align: center;">
        <div id="grafico-barras" style="width: 700px; height: 400px; margin: auto;"></div>
      </div>
    </section>

    <br><br>
    <div style="text-align: center;">
      <a href="{{ url_for('index') }}" class="boton-volver">Volver a la portada</a>
    </div>
  </main>

</body>
</html>
